<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Jogo de Adivinhação</title>

    <link rel="stylesheet" href="guess.css" />
</head>
<body>

    <div class="container">
        <h1>🎯 Jogo de Adivinhação</h1>

        <p class="descricao">
            Tente adivinhar o número entre <strong>0 e 99</strong>
        </p>

        <div class="jogo">
            <input 
                type="number" 
                id="palpite" 
                placeholder="Digite um número"
                min="0"
                max="99"
            />

            <button id="btnVerificar">
                Verificar
            </button>
        </div>

        <p id="mensagem">Boa sorte! 🍀</p>

        <p class="tentativas">
            Tentativas: <span id="contador">0</span>
        </p>

        <button id="reiniciar" class="reiniciar">
            Jogar Novamente
        </button>
    </div>

    <script src="guess.js"></script>
</body>
</html>
